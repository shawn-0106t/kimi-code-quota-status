# Static CRT linking (SPEC §11): the artifact is a single exe with no runtime dependencies.
# Do not force a [build] target here: the host's default triple is already x86_64-pc-windows-msvc,
# and forcing it would move the artifact path to target/<triple>/release/, deviating from the PLAN
# acceptance path target/release/quota-status.exe. This project supports Windows x64 only.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
