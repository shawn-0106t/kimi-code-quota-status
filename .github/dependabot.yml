version: 2

updates:
  # Rust dependencies (Cargo.toml + Cargo.lock); patch/minor bumps are grouped
  # into one PR to cut noise, while major upgrades get their own PR for review
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions versions (ci.yml / release.yml)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
