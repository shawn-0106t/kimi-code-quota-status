name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # 敏感信息扫描（第二道防线）：本地 pre-commit 的 gitleaks 可被 --no-verify
  # 绕过，CI 侧对全量提交历史兜底扫描
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read # 最小权限；gitleaks-action@v2 对个人公共 repo 无需 GITLEAKS_LICENSE
      # （未来转入 org 或转 private 时会开始要求 license，job 会明确报错提示）
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 完整历史，gitleaks 扫描全部 commit

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: windows-latest
    permissions:
      contents: read # 最小权限；test 仅需 checkout 拉取代码（CodeQL actions/missing-workflow-permissions）
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: Set timezone to UTC+08:00 (golden parity fail-fast requirement)
        run: tzutil /s "China Standard Time"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --lib --locked

      - name: Golden parity tests
        run: cargo test --test golden --locked

      - name: Release build (static single exe)
        run: cargo build --release --locked

      - name: Assert exe size within 5MB budget (SPEC §11)
        shell: pwsh
        run: |
          $size = (Get-Item target/release/quota-status.exe).Length
          Write-Output "quota-status.exe: $size bytes"
          if ($size -gt 5MB) { throw "exe exceeds 5MB budget: $size" }
