name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # Secret scanning (second line of defense): the local pre-commit gitleaks hook
  # can be bypassed with --no-verify, so CI sweeps the full commit history
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read # least privilege; gitleaks-action@v2 needs no GITLEAKS_LICENSE for personal public repos
      # (org-owned or private repos will start requiring a license; the job then fails with an explicit error)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks scans every commit

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: windows-latest
    permissions:
      contents: read # least privilege; test only needs checkout to pull code (CodeQL actions/missing-workflow-permissions)
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: Set timezone to UTC+08:00 (golden parity fail-fast requirement)
        run: tzutil /s "China Standard Time"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --lib --locked

      - name: Golden parity tests
        run: cargo test --test golden --locked

      - name: Release build (static single exe)
        run: cargo build --release --locked

      - name: Assert exe size within 5MB budget (SPEC §11)
        shell: pwsh
        run: |
          $size = (Get-Item target/release/quota-status.exe).Length
          Write-Output "quota-status.exe: $size bytes"
          if ($size -gt 5MB) { throw "exe exceeds 5MB budget: $size" }
