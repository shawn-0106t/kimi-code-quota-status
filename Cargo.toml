[package]
name = "quota-status"
version = "1.1.0"
edition = "2024"
rust-version = "1.97"
description = "Kimi Code CLI statusline quota display: cached render + detached refresh (5h/week/month)"
license = "MIT"
repository = "https://github.com/shawn-0106t/kimi-code-quota-status"
keywords = ["kimi", "statusline", "quota", "cli", "windows"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde feature: DateTime<Local> serializes directly as RFC3339 (AutoSi fractional seconds; golden parity depends on this behavior)
chrono = { version = "0.4", features = ["serde", "clock"] }
toml = "1.1"
# Blocking lightweight HTTP client + rustls (bundled root certificates), SPEC §11 whitelist; no tokio/async
ureq = { version = "3", features = ["rustls"] }
filetime = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
